[project]
name = "foliopp-yfinance"
version = "0.1.0"
description = "yfinance provider for FolioPP - Indian equities"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.2",
    "foliopp-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foliopp_yfinance"]
