[project]
name = "foliopp-nse"
version = "0.1.0"
description = "NSE India provider for FolioPP - direct NSE API integration"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "brotli>=1.0.9",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.2",
    "foliopp-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foliopp_nse"]
